<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kumpel — phone, tour step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.sq{background:var(--der)}
.ci{background:var(--die);border-radius:50%}
.tr{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tk{flex:1;height:6px;border-radius:2px;background:var(--s3)}
.tk.on{background:var(--t1)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s3)}
.dot.on{background:var(--t1)}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden">

<div style="position:absolute;left:20px;right:20px;top:26px;display:flex;justify-content:space-between;align-items:center"><div class="eyebrow">Do · 5. Nov</div><div style="display:flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--s2);font:600 14px var(--fb)">6 Tage</div></div>
<h1 class="de" style="position:absolute;left:20px;top:70px;margin:0;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1">Guten Abend,<br>Sasha.</h1>
<section class="card" style="position:absolute;left:16px;right:16px;top:176px;height:340px;border-radius:30px;padding:24px;overflow:hidden">
  <div style="position:absolute;right:-26px;top:-20px;width:170px;height:170px"><div class="ci" style="position:absolute;left:60px;top:0;width:100px;height:100px"></div><div class="sq" style="position:absolute;left:10px;top:70px;width:90px;height:90px"></div><div class="tr" style="position:absolute;left:84px;top:84px;width:80px;height:70px"></div></div>
  <div style="position:relative"><div class="eyebrow">Weiter · Lektion 5</div><div class="de" style="margin-top:78px;font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1">Gegenstände<br>und Plural</div><div style="font-size:15px;color:var(--t2);margin-top:8px">Things and plurals</div>
  <div style="margin-top:56px;height:54px;border-radius:999px;background:var(--cta);color:var(--cta-i);display:grid;place-items:center;font:600 16px var(--fb)">Weiter lernen →</div></div>
</section>
<section class="card" style="position:absolute;left:16px;top:528px;width:171px;height:112px;padding:16px;border-radius:22px"><div class="eyebrow">Tagesziel</div></section>
<section class="card" style="position:absolute;right:16px;top:528px;width:171px;height:112px;padding:16px;border-radius:22px"><div class="eyebrow">Wiederholen</div></section>

<!-- spotlight -->
<div style="position:absolute;left:8px;top:168px;width:374px;height:356px;border-radius:36px;box-shadow:0 0 0 2000px rgba(0,0,0,.68),0 0 0 2px var(--t1)"></div>

<!-- tour card -->
<div role="dialog" aria-label="Tour step" style="position:absolute;left:16px;right:16px;top:556px;border-radius:26px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.6);padding:20px 22px 18px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
    <svg viewBox="0 0 88 64" width="44" height="32" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="var(--cta)"/><circle cx="27" cy="28" r="4.2" fill="var(--cta-i)"/><circle cx="45" cy="28" r="4.2" fill="var(--cta-i)"/><path d="M26 41c3 3.5 15 3.5 18 0" stroke="var(--cta-i)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M66 32l14-6v12z" fill="var(--t1)" transform="rotate(-90 73 32) translate(0 0)"/></svg>
    <div class="eyebrow" style="flex:1">Station 1 von 5</div>
    <span style="color:var(--t3);font:500 13px var(--fb)">Überspringen</span>
  </div>
  <div class="de" style="font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1">Weiter</div>
  <p style="margin:8px 0 16px;font-size:14.5px;line-height:1.5;color:var(--t2)">This card always holds your next lesson. One tap and you are back where you stopped.</p>
  <div style="display:flex;align-items:center;gap:14px"><div style="display:flex;gap:6px;flex:1"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div style="height:44px;padding:0 22px;border-radius:999px;background:var(--cta);color:var(--cta-i);display:grid;place-items:center;font:600 15px var(--fb)">Weiter</div></div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
