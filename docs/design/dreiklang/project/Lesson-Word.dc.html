<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson — Wortkarte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 34px;border-radius:999px;border:0;background:var(--cta);color:var(--cta-i);font:600 17px var(--fb);cursor:pointer;text-decoration:none}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sq{background:var(--der)}
.ci{background:var(--die);border-radius:50%}
.tr{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ib{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--t1);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.ib:hover{background:var(--s2)}
.lb{font-size:12px;color:var(--t3);margin-top:8px;text-align:center}
.seg{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.seg i{display:block;height:100%;background:var(--t1)}
.sl{font:500 12px var(--fb);color:var(--t3);margin-top:10px}
.sl.on{color:var(--t1);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font:500 13px var(--fb);color:var(--t2)}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.pulse{animation:ring 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="min-height:900px;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <!-- watermark: the noun’s shape -->
  <div class="ci" style="position:absolute;left:-190px;top:150px;width:760px;height:760px;opacity:.07"></div>
  <div style="position:absolute;right:-120px;top:-120px;width:460px;height:460px;border-radius:50%;border:1px solid var(--line)"></div>

  <!-- top bar -->
  <header style="position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px;padding:24px 40px 0">
    <div style="flex:0 0 auto;display:flex;align-items:center;gap:16px;min-width:230px">
      <a class="ib" href="Path.dc.html" aria-label="Close lesson"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <div><div class="eyebrow" style="margin-bottom:6px">Lektion 5</div><div class="de" style="font-size:18px;font-weight:600">Gegenstände und Plural</div></div>
    </div>
    <div style="flex:1 1 420px;min-width:0;padding-top:8px">
      <div style="display:grid;grid-template-columns:3fr 2fr 4fr 1.4fr 2fr;gap:6px">
        <div><div class="seg"><i style="width:100%"></i></div><div class="sl">Einstieg</div></div>
        <div><div class="seg"><i style="width:30%"></i></div><div class="sl on">Wörter</div></div>
        <div><div class="seg"><i style="width:0"></i></div><div class="sl">Grammatik</div></div>
        <div><div class="seg"><i style="width:0"></i></div><div class="sl">Aussprache</div></div>
        <div><div class="seg"><i style="width:0"></i></div><div class="sl">Quiz</div></div>
      </div>
    </div>
    <div style="flex:0 0 auto;display:flex;gap:10px;min-width:230px;justify-content:flex-end">
      <button type="button" class="pill" aria-label="Translation language" style="height:48px;padding:0 18px;cursor:pointer;background:transparent">EN <span style="color:var(--t3)">·</span> aus</button>
      <button type="button" class="ib" aria-label="Playback speed" style="font:600 14px var(--fb)">1×</button>
      <button type="button" class="ib" aria-label="Contents"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    </div>
  </header>

  <!-- stage -->
  <main style="position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 40px 10px;text-align:center">
    <div class="eyebrow" style="margin-bottom:26px">Vokabel 3 von 10</div>
    <div class="de" style="font-size:60px;font-weight:300;color:var(--die-t);line-height:1;margin-bottom:-4px;letter-spacing:-.02em">die</div>
    <h1 class="de" style="margin:0;font-size:176px;font-weight:700;letter-spacing:-.045em;line-height:.95">Lampe</h1>

    <div style="display:flex;align-items:center;gap:22px;margin-top:22px;flex-wrap:wrap;justify-content:center">
      <span class="de" style="font-size:26px;font-weight:500;letter-spacing:.02em"><span style="color:var(--die-t);border-bottom:3px solid var(--die);padding-bottom:3px">LAM</span><span style="color:var(--t3)">·pe</span></span>
      <span style="width:1px;height:22px;background:var(--line2)"></span>
      <span style="font-size:15px;color:var(--t3)">Plural <span class="de" style="color:var(--t1);font-size:18px;font-weight:500;margin-left:6px">die Lampen</span></span>
    </div>

    <div style="display:flex;align-items:center;gap:28px;margin-top:34px">
      <div style="position:relative;width:72px;height:72px">
        <span class="pulse" style="position:absolute;inset:0;border-radius:50%;border:2px solid var(--die)"></span>
        <button type="button" aria-label="Play Lampe" style="position:relative;width:72px;height:72px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-i);display:grid;place-items:center;cursor:pointer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:26px;height:26px;fill:currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
      </div>
      <div style="text-align:left"><div style="font-size:28px;color:var(--t1);font-weight:500">lamp</div><div style="font-size:14px;color:var(--t3);margin-top:2px">noun · feminine</div></div>
    </div>

    <div style="margin-top:36px;max-width:640px;width:100%;padding:22px 28px;border-radius:22px;background:var(--s1);border:1px solid var(--line);text-align:left;display:flex;gap:20px;align-items:center">
      <div style="flex:1">
        <div class="de" style="font-size:30px;font-weight:500;line-height:1.25;letter-spacing:-.01em">Die <span style="color:var(--die-t);border-bottom:2px solid var(--die)">Lampe</span> steht auf dem <span style="color:var(--der-t);border-bottom:2px solid var(--der)">Tisch</span>.</div>
        <div style="font-size:15px;color:var(--t3);margin-top:8px">The lamp is on the table.</div>
      </div>
      <button type="button" class="ib" aria-label="Play sentence"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg></button>
    </div>

    <div style="display:flex;gap:30px;margin-top:30px">
      <div><button type="button" class="ib" aria-label="Say it"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg></button><div class="lb">Sprich</div></div>
      <div><button type="button" class="ib" aria-label="Save to review"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 6 6.4.6-4.8 4.3 1.4 6.4L12 17l-5.6 3.3 1.4-6.4L3 9.6 9.4 9z"/></svg></button><div class="lb">Merken</div></div>
      <div><button type="button" class="ib" aria-label="Explain"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2"/><path d="M12 17.2v.1"/></svg></button><div class="lb">Erklären</div></div>
    </div>
  </main>

  <!-- action bar -->
  <footer style="position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 40px 32px">
    <a class="ib" href="Lesson-Word.dc.html" aria-label="Back" style="width:56px;height:56px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
    <div style="font-size:13px;color:var(--t3)"><span style="border:1px solid var(--line2);border-radius:6px;padding:2px 8px;margin-right:8px">Space</span>for Weiter · <span style="border:1px solid var(--line2);border-radius:6px;padding:2px 8px;margin:0 8px">P</span>to play</div>
    <a class="btn" href="Exercise-Mobile.dc.html">Weiter <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
