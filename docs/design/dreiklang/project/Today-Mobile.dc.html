<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heute — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;border:0;background:var(--cta);color:var(--cta-i);font:600 16px var(--fb);cursor:pointer;text-decoration:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sq{background:var(--der)}
.ci{background:var(--die);border-radius:50%}
.tr{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tk{flex:1;height:6px;border-radius:2px;background:var(--s3)}
.tk.on{background:var(--t1)}
.tk.now{background:var(--t1);opacity:.5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--t3);font:500 12px var(--fb);text-decoration:none;padding-top:10px}
.tab.on{color:var(--t1)}
.tab .pl{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.on .pl{background:var(--s3)}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden">

  <div style="position:absolute;left:20px;right:20px;top:26px;display:flex;justify-content:space-between;align-items:center">
    <div class="eyebrow">Do · 5. Nov</div>
    <div style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--s2);font:600 14px var(--fb)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;color:var(--das-t)"><path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>6 Tage</div>
  </div>
  <h1 class="de" style="position:absolute;left:20px;top:70px;margin:0;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1">Guten Abend,<br>Sasha.</h1>

  <!-- hero -->
  <section class="card" style="position:absolute;left:16px;right:16px;top:176px;height:340px;border-radius:30px;padding:24px;overflow:hidden">
    <div style="position:absolute;right:-26px;top:-20px;width:170px;height:170px">
      <div class="ci" style="position:absolute;left:60px;top:0;width:100px;height:100px"></div>
      <div class="sq" style="position:absolute;left:10px;top:70px;width:90px;height:90px"></div>
      <div class="tr" style="position:absolute;left:84px;top:84px;width:80px;height:70px"></div>
    </div>
    <div style="position:relative">
      <div class="eyebrow">Weiter · Lektion 5</div>
      <h2 class="de" style="margin:78px 0 0;font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1">Gegenstände<br>und Plural</h2>
      <div style="font-size:15px;color:var(--t2);margin-top:8px">Things and plurals</div>
      <div style="display:flex;gap:2px;margin-top:22px"><sc-for list="{{ticks}}" as="t" hint-placeholder-count="38"><i class="tk {{t.cls}}"></i></sc-for></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t3);margin:8px 0 22px"><span>Schritt 15 von 38</span><span>~12 min left</span></div>
      <a class="btn" href="Lesson-Word-Mobile.dc.html">Weiter lernen <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
    </div>
  </section>

  <!-- two small cards -->
  <section class="card" style="position:absolute;left:16px;top:528px;width:171px;height:124px;padding:16px;border-radius:22px">
    <div class="eyebrow">Tagesziel</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:14px">
      <div style="position:relative;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--t1) 0 60%,var(--s3) 0)"><div style="position:absolute;inset:7px;border-radius:50%;background:var(--s1)"></div></div>
      <div><div class="de" style="font-size:30px;font-weight:600;line-height:1">18</div><div style="font-size:12px;color:var(--t3);margin-top:2px">of 30 XP</div></div>
    </div>
  </section>
  <section class="card" style="position:absolute;right:16px;top:528px;width:171px;height:124px;padding:16px;border-radius:22px">
    <div class="eyebrow">Wiederholen</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:14px"><span class="de" style="font-size:44px;font-weight:600;line-height:1">14</span><span style="font-size:13px;color:var(--t2)">due</span></div>
    <div style="font-size:12px;color:var(--t3);margin-top:6px">3 min · tap to start</div>
  </section>

  <!-- word of the day -->
  <section class="card" style="position:absolute;left:16px;right:16px;top:664px;height:92px;border-radius:22px;padding:0 20px;display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--der) 11%,var(--s1));border-color:color-mix(in srgb,var(--der) 28%,transparent)">
    <div class="sq" style="width:34px;height:34px;border-radius:6px"></div>
    <div style="flex:1;min-width:0"><div class="eyebrow" style="margin-bottom:8px">Wort des Tages</div><div class="de" style="font-size:26px;font-weight:600;line-height:1"><span style="color:var(--der-t);font-weight:300">der</span> Feierabend</div></div>
    <button type="button" aria-label="Play Feierabend" style="width:44px;height:44px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-i);display:grid;place-items:center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;width:18px;height:18px"><path d="M7 4.5v15l12-7.5z"/></svg></button>
  </section>

  <!-- tab bar -->
  <nav style="position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;padding:0 8px 14px;background:color-mix(in srgb,var(--ink) 88%,transparent);border-top:1px solid var(--line)">
    <a class="tab on" href="Today-Mobile.dc.html"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>Heute</a>
    <a class="tab" href="Today-Mobile.dc.html"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h5v-5h5v-5h5V5h3"/></svg></span>Weg</a>
    <a class="tab" href="Today-Mobile.dc.html"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg></span>Üben</a>
    <a class="tab" href="Today-Mobile.dc.html"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a1 1 0 011-1h6v16H5a1 1 0 01-1-1z"/><path d="M20 5a1 1 0 00-1-1h-6v16h6a1 1 0 001-1z"/></svg></span>Lesen</a>
    <a class="tab" href="Today-Mobile.dc.html"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></span>Du</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ticks = [];
    for (let i = 0; i < 38; i++) ticks.push({ cls: i < 14 ? 'on' : i === 14 ? 'now' : '' });
    return { theme: this.props.theme ?? 'dark', ticks };
  }
}
</script>
</body>
</html>
