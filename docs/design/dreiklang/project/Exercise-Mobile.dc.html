<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise and feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sq{background:var(--der)}
.ci{background:var(--die);border-radius:50%}
.tr{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--t1);display:grid;place-items:center;text-decoration:none}
.seg{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;flex:1}
.seg i{display:block;height:100%;background:var(--t1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet{animation:up .3s cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.act{flex:1;height:56px;border-radius:999px;border:0;font:600 17px var(--fb);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden">

  <header style="position:absolute;left:16px;right:16px;top:20px;display:flex;align-items:center;gap:14px">
    <a class="ib" href="Today-Mobile.dc.html" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="flex:1;display:flex;gap:4px"><div class="seg" style="flex:3"><i style="width:100%"></i></div><div class="seg" style="flex:2"><i style="width:100%"></i></div><div class="seg" style="flex:4"><i style="width:100%"></i></div><div class="seg" style="flex:1.4"><i style="width:100%"></i></div><div class="seg" style="flex:2"><i style="width:40%"></i></div></div>
  </header>

  <section style="position:absolute;left:24px;right:24px;top:96px">
    <div class="eyebrow">Quiz · 4 von 10</div>
    <h1 class="de" style="margin:26px 0 4px;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1">Welcher Artikel?</h1>
    <div style="font-size:15px;color:var(--t3)">Which article goes with this word?</div>
  </section>

  <section style="position:absolute;left:24px;right:24px;top:250px;display:flex;align-items:flex-end;gap:18px">
    <div class="de" style="min-width:118px;height:84px;border-bottom:4px solid {{slotLine}};display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:64px;font-weight:300;line-height:1;letter-spacing:-.02em;color:{{slotColor}};{{slotDash}}">{{pickedLabel}}</div>
    <div class="de" style="font-size:76px;font-weight:700;letter-spacing:-.04em;line-height:1;padding-bottom:6px">Tisch</div>
  </section>
  <div style="position:absolute;left:24px;top:352px;font-size:15px;color:var(--t3)">table</div>

  <!-- choices -->
  <section style="position:absolute;left:16px;right:16px;top:410px;display:flex;gap:12px">
    <button type="button" aria-label="der" onClick="{{pickDer}}" style="{{derStyle}}"><span class="sq" style="width:34px;height:34px;display:block"></span><span style="font-size:34px;font-weight:600;line-height:1;color:var(--der-t)">der</span></button>
    <button type="button" aria-label="die" onClick="{{pickDie}}" style="{{dieStyle}}"><span class="ci" style="width:34px;height:34px;display:block"></span><span style="font-size:34px;font-weight:600;line-height:1;color:var(--die-t)">die</span></button>
    <button type="button" aria-label="das" onClick="{{pickDas}}" style="{{dasStyle}}"><span class="tr" style="width:38px;height:34px;display:block"></span><span style="font-size:34px;font-weight:600;line-height:1;color:var(--das-t)">das</span></button>
  </section>

  <!-- check -->
  <sc-if value="{{notChecked}}" hint-placeholder-val="{{true}}">
    <footer style="position:absolute;left:0;right:0;bottom:0;padding:14px 16px 30px">
      <button type="button" onClick="{{check}}" style="{{checkStyle}}">Prüfen</button>
    </footer>
  </sc-if>

  <!-- correct sheet -->
  <sc-if value="{{isCorrect}}" hint-placeholder-val="{{false}}">
    <div class="sheet" style="position:absolute;left:0;right:0;bottom:0;padding:26px 20px 30px;border-radius:30px 30px 0 0;background:color-mix(in srgb,var(--ok) 15%,var(--s1));border-top:1.5px solid var(--ok)">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:36px;height:36px;border-radius:50%;background:var(--ok);color:#07130E;display:grid;place-items:center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.6"><path d="M5 12l5 5 9-10"/></svg></span>
        <span class="de" style="font-size:34px;font-weight:600;color:var(--ok);letter-spacing:-.01em">Richtig!</span>
      </div>
      <div class="de" style="font-size:30px;font-weight:500;margin:16px 0 6px"><span style="color:var(--der-t)">der</span> Tisch</div>
      <div style="font-size:15px;color:var(--t2);margin-bottom:22px">+10 XP · 3 richtig in Folge</div>
      <a class="act" href="Complete-Mobile.dc.html" style="width:100%;background:var(--ok);color:#07130E">Weiter</a>
    </div>
  </sc-if>

  <!-- almost sheet -->
  <sc-if value="{{isWrong}}" hint-placeholder-val="{{false}}">
    <div class="sheet" style="position:absolute;left:0;right:0;bottom:0;padding:26px 20px 30px;border-radius:30px 30px 0 0;background:color-mix(in srgb,var(--ember) 15%,var(--s1));border-top:1.5px solid var(--ember)">
      <div class="de" style="font-size:34px;font-weight:600;color:var(--ember);letter-spacing:-.01em">Fast!</div>
      <div class="de" style="font-size:28px;font-weight:500;margin:12px 0 6px">Es heißt <span style="color:var(--der-t);border-bottom:2px solid var(--der)">der</span> Tisch.</div>
      <div style="font-size:15px;line-height:1.5;color:var(--t2);margin-bottom:22px">Tisch is masculine: der Tisch, die Tische. Learn the article with the noun, as one chunk.</div>
      <div style="display:flex;gap:12px">
        <button type="button" class="act" onClick="{{retry}}" style="background:transparent;border:1.5px solid var(--ember);color:var(--ember)">Nochmal</button>
        <a class="act" href="Complete-Mobile.dc.html" style="background:var(--ember);color:#1A0C02">Weiter</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const picked = st.picked || null;
    const checked = !!st.checked;
    const correct = checked && picked === 'der';
    const wrong = checked && picked !== 'der';
    const base = 'flex:1;height:156px;border-radius:26px;border:1.5px solid var(--line2);background:var(--s1);color:var(--t1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;font-family:Jost,sans-serif;transition:transform .2s,border-color .2s,background .2s,opacity .2s;';
    const tile = (key, varName) => {
      let s = base;
      if (picked === key) s += 'border-color:var(--' + varName + ');background:color-mix(in srgb,var(--' + varName + ') 16%,var(--s1));transform:translateY(-6px);';
      if (checked && picked !== key && key !== 'der') s += 'opacity:.45;';
      if (checked && key === 'der' && picked !== 'der') s += 'border-color:var(--ok);';
      return s;
    };
    const colours = { der: 'var(--der-t)', die: 'var(--die-t)', das: 'var(--das-t)' };
    const lines = { der: 'var(--der)', die: 'var(--die)', das: 'var(--das)' };
    const go = (k) => () => { if (!(this.state && this.state.checked)) this.setState({ picked: k }); };
    return {
      theme: this.props.theme ?? 'dark',
      pickedLabel: picked || '',
      slotColor: picked ? colours[picked] : 'var(--t3)',
      slotLine: picked ? lines[picked] : 'var(--t3)',
      slotDash: picked ? '' : 'opacity:.6;',
      derStyle: tile('der', 'der'),
      dieStyle: tile('die', 'die'),
      dasStyle: tile('das', 'das'),
      pickDer: go('der'),
      pickDie: go('die'),
      pickDas: go('das'),
      notChecked: !checked,
      isCorrect: correct,
      isWrong: wrong,
      checkStyle: 'width:100%;height:56px;border-radius:999px;border:0;font:600 17px Inter,sans-serif;cursor:' + (picked ? 'pointer' : 'not-allowed') + ';background:' + (picked ? 'var(--cta)' : 'var(--s3)') + ';color:' + (picked ? 'var(--cta-i)' : 'var(--t3)') + ';',
      check: () => { if (this.state && this.state.picked) this.setState({ checked: true }); },
      retry: () => this.setState({ picked: null, checked: false }),
    };
  }
}
</script>
</body>
</html>
