<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lektion geschafft</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sq{background:var(--der)}
.ci{background:var(--die);border-radius:50%}
.tr{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
.act{height:56px;border-radius:999px;font:600 17px var(--fb);display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
@keyframes snap{0%{transform:translateY(-60px);opacity:0}70%{transform:translateY(6px);opacity:1}100%{transform:translateY(0)}}
@keyframes snapx{0%{transform:translateX(-70px);opacity:0}70%{transform:translateX(6px);opacity:1}100%{transform:translateX(0)}}
@keyframes snapy{0%{transform:translateY(70px);opacity:0}70%{transform:translateY(-6px);opacity:1}100%{transform:translateY(0)}}
.s1{animation:snapx .6s cubic-bezier(.2,.9,.3,1) both}
.s2{animation:snap .6s .15s cubic-bezier(.2,.9,.3,1) both}
.s3{animation:snapy .6s .3s cubic-bezier(.2,.9,.3,1) both}
@media (prefers-reduced-motion:reduce){.s1,.s2,.s3{animation:none}}
.blk{width:30px;height:30px;border-radius:7px;background:var(--t1)}
.blk.off{background:var(--s3)}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden">

  <div style="position:absolute;left:50%;top:-40px;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--t1) 10%,transparent),transparent)"></div>

  <!-- assembled composition -->
  <div style="position:absolute;left:65px;top:70px;width:260px;height:270px">
    <div class="sq s1" style="position:absolute;left:10px;top:110px;width:150px;height:150px"></div>
    <div class="ci s2" style="position:absolute;left:110px;top:6px;width:130px;height:130px"></div>
    <div class="tr s3" style="position:absolute;left:96px;top:136px;width:150px;height:130px"></div>
    <div class="de" style="position:absolute;left:34px;top:216px;font-size:22px;font-weight:600;color:#fff">der</div>
    <div class="de" style="position:absolute;left:150px;top:62px;font-size:22px;font-weight:600;color:#fff">die</div>
    <div class="de" style="position:absolute;left:150px;top:222px;font-size:22px;font-weight:600;color:#17171B">das</div>
  </div>

  <section style="position:absolute;left:24px;right:24px;top:368px;text-align:center">
    <div class="eyebrow">Lektion 5 · A1</div>
    <h1 class="de" style="margin:14px 0 6px;font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1">Geschafft!</h1>
    <div class="de" style="font-size:20px;color:var(--t2);font-weight:400">Gegenstände und Plural</div>
  </section>

  <section style="position:absolute;left:16px;right:16px;top:496px;display:flex;gap:10px">
    <div style="flex:1;padding:16px 12px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:center"><div class="de" style="font-size:34px;font-weight:600;line-height:1">+45</div><div style="font-size:12px;color:var(--t3);margin-top:6px">XP</div></div>
    <div style="flex:1;padding:16px 12px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:center"><div class="de" style="font-size:34px;font-weight:600;line-height:1">9/10</div><div style="font-size:12px;color:var(--t3);margin-top:6px">richtig</div></div>
    <div style="flex:1;padding:16px 12px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:center"><div class="de" style="font-size:34px;font-weight:600;line-height:1">10</div><div style="font-size:12px;color:var(--t3);margin-top:6px">neue Wörter</div></div>
  </section>

  <section style="position:absolute;left:16px;right:16px;top:604px;padding:18px 20px;border-radius:22px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;gap:16px">
    <div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:var(--das-t)"><path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg><span class="de" style="font-size:22px;font-weight:600">7 Tage in Folge</span></div><div style="font-size:13px;color:var(--t3);margin-top:6px">One block added to your tower.</div></div>
    <div style="display:flex;gap:4px;align-items:flex-end"><div class="blk" style="width:12px;height:12px;border-radius:3px"></div><div class="blk" style="width:12px;height:18px;border-radius:3px"></div><div class="blk" style="width:12px;height:24px;border-radius:3px"></div><div class="blk" style="width:12px;height:30px;border-radius:3px"></div></div>
  </section>

  <footer style="position:absolute;left:16px;right:16px;bottom:30px;display:flex;flex-direction:column;gap:10px">
    <a class="act" href="Path.dc.html" style="background:var(--cta);color:var(--cta-i)">Nächste Lektion <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
    <a class="act" href="Today-Mobile.dc.html" style="height:48px;color:var(--t2);font-weight:500">Zurück zu Heute</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
