<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kumpel — phone, resting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.sq{background:var(--der)}
.ci{background:var(--die);border-radius:50%}
.tr{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tk{flex:1;height:6px;border-radius:2px;background:var(--s3)}
.tk.on{background:var(--t1)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--t3);font:500 12px var(--fb);padding-top:10px}
.tab.on{color:var(--t1)}
.tab .pl{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.on .pl{background:var(--s3)}
@keyframes ringp{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.ringp{animation:ringp 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){.ringp{animation:none}}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden">

<div style="position:absolute;left:20px;right:20px;top:26px;display:flex;justify-content:space-between;align-items:center"><div class="eyebrow">Do · 5. Nov</div><div style="display:flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--s2);font:600 14px var(--fb)">6 Tage</div></div>
<h1 class="de" style="position:absolute;left:20px;top:70px;margin:0;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1">Guten Abend,<br>Sasha.</h1>
<section class="card" style="position:absolute;left:16px;right:16px;top:176px;height:340px;border-radius:30px;padding:24px;overflow:hidden">
  <div style="position:absolute;right:-26px;top:-20px;width:170px;height:170px"><div class="ci" style="position:absolute;left:60px;top:0;width:100px;height:100px"></div><div class="sq" style="position:absolute;left:10px;top:70px;width:90px;height:90px"></div><div class="tr" style="position:absolute;left:84px;top:84px;width:80px;height:70px"></div></div>
  <div style="position:relative"><div class="eyebrow">Weiter · Lektion 5</div><div class="de" style="margin-top:78px;font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1">Gegenstände<br>und Plural</div><div style="font-size:15px;color:var(--t2);margin-top:8px">Things and plurals</div>
  <div style="display:flex;gap:2px;margin-top:22px"><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk on"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i></div>
  <div style="margin-top:30px;height:54px;border-radius:999px;background:var(--cta);color:var(--cta-i);display:grid;place-items:center;font:600 16px var(--fb)">Weiter lernen →</div></div>
</section>
<section class="card" style="position:absolute;left:16px;top:528px;width:171px;height:112px;padding:16px;border-radius:22px"><div class="eyebrow">Tagesziel</div><div class="de" style="font-size:30px;font-weight:600;margin-top:16px">18 <span style="font:400 12px var(--fb);color:var(--t3)">of 30 XP</span></div></section>
<section class="card" style="position:absolute;right:16px;top:528px;width:171px;height:112px;padding:16px;border-radius:22px"><div class="eyebrow">Wiederholen</div><div class="de" style="font-size:44px;font-weight:600;line-height:1;margin-top:14px">14</div></section>

<nav style="position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;padding:0 8px 14px;background:color-mix(in srgb,var(--ink) 88%,transparent);border-top:1px solid var(--line)">
  <div class="tab on"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>Heute</div>
  <div class="tab"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h5v-5h5v-5h5V5h3"/></svg></span>Weg</div>
  <div class="tab"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg></span>Üben</div>
  <div class="tab"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a1 1 0 011-1h6v16H5a1 1 0 01-1-1z"/><path d="M20 5a1 1 0 00-1-1h-6v16h6a1 1 0 001-1z"/></svg></span>Lesen</div>
  <div class="tab"><span class="pl"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></span>Du</div>
</nav>

<!-- Kumpel, resting above the tab bar -->
<div style="position:absolute;left:230px;top:688px;padding:10px 16px;border-radius:16px 16px 6px 16px;background:var(--s2);border:1px solid var(--line2);font:500 13px var(--fb)">Tap me for help</div>
<div style="position:absolute;right:16px;top:708px;width:52px;height:52px">
  <span class="ringp" style="position:absolute;inset:0;border-radius:50%;border:2px solid var(--t1)"></span>
  <svg viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="Kumpel" style="position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))"><circle cx="32" cy="32" r="30" fill="var(--cta)"/><circle cx="23" cy="28" r="4.2" fill="var(--cta-i)"/><circle cx="41" cy="28" r="4.2" fill="var(--cta-i)"/><path d="M23 41c3 3.5 15 3.5 18 0" stroke="var(--cta-i)" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
