<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson — Wortkarte phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dz{--ink:#09090B;--s1:#111114;--s2:#17171B;--s3:#222228;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--t1:#F5F3EE;--t2:#B7B4AD;--t3:#8F8C85;--der:#5B8CFF;--die:#FF6F96;--das:#FFCB45;--der-t:#8DAEFF;--die-t:#FF8FAE;--das-t:#FFCB45;--ok:#46E0A0;--ember:#FF9150;--cta:#F5F3EE;--cta-i:#09090B;--fd:'Jost',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;font-family:var(--fb);background:var(--ink);color:var(--t1);-webkit-font-smoothing:antialiased}
.dz *{box-sizing:border-box}
.dz[data-theme="light"]{--ink:#F1EDE4;--s1:#FAF7F0;--s2:#FFFFFF;--s3:#E8E3D8;--line:rgba(20,18,12,.10);--line2:rgba(20,18,12,.18);--t1:#111114;--t2:#47443E;--t3:#6B675F;--der:#2F5FF0;--die:#E83E73;--das:#F4B400;--der-t:#2447C9;--die-t:#C2285D;--das-t:#7A5600;--ok:#0E9F6E;--ember:#D9601A;--cta:#111114;--cta-i:#F5F3EE}
.de{font-family:var(--fd)}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ci{background:var(--die);border-radius:50%}
.ib{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--t1);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.seg{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;flex:1}
.seg i{display:block;height:100%;background:var(--t1)}
.lb{font-size:12px;color:var(--t3);margin-top:6px;text-align:center}
</style>
</helmet>
<div class="dz" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden">
  <div class="ci" style="position:absolute;left:-150px;top:120px;width:480px;height:480px;opacity:.07"></div>

  <!-- top -->
  <header style="position:absolute;left:16px;right:16px;top:20px;display:flex;align-items:center;gap:14px">
    <a class="ib" href="Today-Mobile.dc.html" aria-label="Close lesson" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="flex:1;display:flex;gap:4px"><div class="seg" style="flex:3"><i style="width:100%"></i></div><div class="seg" style="flex:2"><i style="width:30%"></i></div><div class="seg" style="flex:4"><i style="width:0"></i></div><div class="seg" style="flex:1.4"><i style="width:0"></i></div><div class="seg" style="flex:2"><i style="width:0"></i></div></div>
    <button type="button" class="ib" aria-label="Contents" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </header>

  <!-- word -->
  <section style="position:absolute;left:0;right:0;top:92px;text-align:center">
    <div class="eyebrow">Wörter · 3 von 10</div>
    <div class="de" style="font-size:44px;font-weight:300;color:var(--die-t);line-height:1;margin-top:30px;letter-spacing:-.02em">die</div>
    <h1 class="de" style="margin:0;font-size:112px;font-weight:700;letter-spacing:-.045em;line-height:.95">Lampe</h1>
    <div style="display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px">
      <span class="de" style="font-size:22px;font-weight:500;letter-spacing:.02em"><span style="color:var(--die-t);border-bottom:3px solid var(--die);padding-bottom:2px">LAM</span><span style="color:var(--t3)">·pe</span></span>
      <span style="width:1px;height:18px;background:var(--line2)"></span>
      <span class="de" style="font-size:16px;color:var(--t2)">die Lampen</span>
    </div>
    <div style="display:flex;justify-content:center;align-items:center;gap:18px;margin-top:22px">
      <button type="button" aria-label="Play Lampe" style="width:64px;height:64px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-i);display:grid;place-items:center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;fill:currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
      <div style="text-align:left"><div style="font-size:24px;font-weight:500">lamp</div><div style="font-size:13px;color:var(--t3)">noun · feminine</div></div>
    </div>
  </section>

  <!-- example -->
  <section style="position:absolute;left:16px;right:16px;top:446px;padding:18px 20px;border-radius:22px;background:var(--s1);border:1px solid var(--line);display:flex;gap:14px;align-items:center">
    <div style="flex:1">
      <div class="de" style="font-size:24px;font-weight:500;line-height:1.25">Die <span style="color:var(--die-t);border-bottom:2px solid var(--die)">Lampe</span> steht auf dem <span style="color:var(--der-t);border-bottom:2px solid var(--der)">Tisch</span>.</div>
      <div style="font-size:14px;color:var(--t3);margin-top:6px">The lamp is on the table.</div>
    </div>
    <button type="button" class="ib" aria-label="Play sentence"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg></button>
  </section>

  <!-- tools -->
  <section style="position:absolute;left:0;right:0;top:578px;display:flex;justify-content:center;gap:34px">
    <div><button type="button" class="ib" aria-label="Say it"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg></button><div class="lb">Sprich</div></div>
    <div><button type="button" class="ib" aria-label="Save to review"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 6 6.4.6-4.8 4.3 1.4 6.4L12 17l-5.6 3.3 1.4-6.4L3 9.6 9.4 9z"/></svg></button><div class="lb">Merken</div></div>
    <div><button type="button" class="ib" aria-label="Translation"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg></button><div class="lb">EN an</div></div>
    <div><button type="button" class="ib" aria-label="Explain"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2"/><path d="M12 17.2v.1"/></svg></button><div class="lb">Erklären</div></div>
  </section>

  <!-- bar -->
  <footer style="position:absolute;left:0;right:0;bottom:0;padding:14px 16px 30px;display:flex;gap:12px;background:linear-gradient(to top,var(--ink) 70%,transparent)">
    <a class="ib" href="Lesson-Word-Mobile.dc.html" aria-label="Back" style="width:56px;height:56px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
    <a href="Exercise-Mobile.dc.html" style="flex:1;height:56px;border-radius:999px;background:var(--cta);color:var(--cta-i);display:flex;align-items:center;justify-content:center;gap:10px;font:600 17px var(--fb);text-decoration:none">Weiter <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
